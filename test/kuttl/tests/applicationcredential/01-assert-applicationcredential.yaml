
# Assert that the KeystoneApplicationCredential reaches Ready status
apiVersion: keystone.openstack.org/v1beta1
kind: KeystoneApplicationCredential
metadata:
  name: nova-applicationcredential
status:
  conditions:
    - type: Ready
      status: "True"
    - type: ApplicationCredentialReady
      status: "True"

---
# Assert that the application credential secret was created with proper data
apiVersion: v1
kind: Secret
metadata:
  name: nova-applicationcredential-application-credential
data:
  id: ~ # Should contain the credential ID
  secret: ~ # Should contain the credential secret

---
# Assert that the original service password secret still exists
apiVersion: v1
kind: Secret
metadata:
  name: nova-service-password
